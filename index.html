<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Story Ultra Pro</title>

<style>
body { margin:0; overflow:hidden; background:black; }

/* 🔐 LOCK */
#lockScreen{
 position:absolute;width:100%;height:100%;
 display:flex;justify-content:center;align-items:center;
 flex-direction:column;background:black;color:white;z-index:10;
}
input{padding:10px;font-size:20px;}
button{padding:10px 20px;margin-top:10px;}

/* 💖 TEXT */
#text{
 position:absolute;top:40%;width:100%;
 text-align:center;font-size:40px;color:#ff4d6d;display:none;
 text-shadow:0 0 20px red;
}

/* 📸 FINAL */
#photoEnd{
 position:absolute;width:100%;height:100%;
 display:none;justify-content:center;align-items:center;
 flex-direction:column;background:black;
}
#photoEnd img{
 max-width:80%;border-radius:20px;
 box-shadow:0 0 40px red;
}
#photoEnd h1{
 color:#ff4d6d;font-size:40px;text-align:center;
}
</style>
</head>

<body>

<div id="lockScreen">
<h1>Enter Password 💖</h1>
<input id="pass" type="password">
<button onclick="unlock()">Enter</button>
</div>

<canvas id="scene"></canvas>

<div id="text">
I love you so much ❤️<br>
My love 💖<br>
You are my forever… 🌹
</div>

<div id="photoEnd">
<img src="your-photo.jpg">
<h1>
I love you so much ❤️<br>
My love 💖<br>
You are my heart, my world, my everything 🌍💞
</h1>
</div>

<audio id="music" src="your-music.mp3"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
let started=false;
function unlock(){
 if(document.getElementById("pass").value==="2531"){
  document.getElementById("lockScreen").style.display="none";
  started=true;
  document.getElementById("music").play().catch(()=>{});
 } else alert("Wrong password ❌");
}

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
const renderer=new THREE.WebGLRenderer({canvas:sceneCanvas,alpha:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

// 🌌 NIGHT SKY
const stars=[];
for(let i=0;i<200;i++){
 let star=new THREE.Mesh(
  new THREE.SphereGeometry(0.03),
  new THREE.MeshBasicMaterial({color:0xffffff})
 );
 star.position.set(Math.random()*20-10,Math.random()*10-5,-5);
 scene.add(star);
 stars.push(star);
}

// 🌳 tree
const tree=new THREE.Mesh(
 new THREE.CylinderGeometry(0.2,0.2,2),
 new THREE.MeshBasicMaterial({color:0x654321})
);
tree.position.x=-2;
scene.add(tree);

// 👦 boy
const boy=new THREE.Mesh(
 new THREE.PlaneGeometry(1.5,2.5),
 new THREE.MeshBasicMaterial({map:new THREE.TextureLoader().load("boy.png"),transparent:true})
);
boy.position.set(-2,-1,0);
scene.add(boy);

// 👧 girl
const girl=new THREE.Mesh(
 new THREE.PlaneGeometry(1.5,2.5),
 new THREE.MeshBasicMaterial({map:new THREE.TextureLoader().load("girl.png"),transparent:true})
);
girl.position.set(4,-1,0);
scene.add(girl);

// ❤️ heart
const heart=new THREE.Mesh(
 new THREE.SphereGeometry(0.3),
 new THREE.MeshBasicMaterial({color:0xff0000})
);
heart.visible=false;
scene.add(heart);

// ✨ sparkles
let sparkles=[];
for(let i=0;i<60;i++){
 let s=new THREE.Mesh(
  new THREE.SphereGeometry(0.05),
  new THREE.MeshBasicMaterial({color:0xffffff,transparent:true})
 );
 s.position.set(Math.random()*10-5,Math.random()*6-3,0);
 scene.add(s);
 sparkles.push(s);
}

// 💋 particles
let particles=[];
function heartParticle(x,y){
 let p=new THREE.Mesh(
  new THREE.SphereGeometry(0.05),
  new THREE.MeshBasicMaterial({color:0xff69b4})
 );
 p.position.set(x,y,0);
 scene.add(p);
 particles.push(p);
}

let step=0;

function animate(){
requestAnimationFrame(animate);
if(!started) return;

// 🌌 stars twinkle
stars.forEach(s=>{
 s.material.opacity=Math.abs(Math.sin(step*0.02));
});

// ✨ sparkles
sparkles.forEach(s=>{
 s.position.y+=0.01;
 if(s.position.y>3) s.position.y=-3;
});

// 👧 walk
if(step<200) girl.position.x-=0.02;

// ❤️ heart
if(step===200){
 heart.visible=true;
 heart.position.set(boy.position.x,boy.position.y+1,0);
}

// 💓 glow
if(step>200 && step<260){
 boy.material.color.setRGB(1,0.5+Math.sin(step*0.1)*0.5,0.5);
}

// 🤗 hug
if(step>260 && step<350){
 boy.position.x+=0.01;
 girl.position.x-=0.005;
}

// 😘 kiss
if(step>350 && step<450){
 boy.position.x+=0.01;
 girl.position.x-=0.01;

 if(step%4===0){
  heartParticle((boy.position.x+girl.position.x)/2,boy.position.y+1);
 }
}

// 💫 particles
particles.forEach((p,i)=>{
 p.position.y+=0.02;
 p.scale.x+=0.01;
 if(p.position.y>3){
  scene.remove(p);
  particles.splice(i,1);
 }
});

// 🪑 sit
if(step>450 && step<550){
 boy.position.y-=0.01;
 girl.position.y-=0.01;
}

// 💖 text
if(step===550){
 document.getElementById("text").style.display="block";
}

// 📸 end
if(step===750){
 document.getElementById("photoEnd").style.display="flex";
}

// 🎬 CINEMATIC CAMERA
if(step<150){
 camera.position.x=-2;
 camera.position.z-=0.01;
}
else if(step<250){
 camera.position.x+=0.01;
}
else if(step<350){
 camera.position.x+=( (boy.position.x+girl.position.x)/2 - camera.position.x )*0.05;
 camera.position.z=5;
}
else if(step<450){
 camera.position.x=(boy.position.x+girl.position.x)/2;
 camera.position.z=3;
}
else if(step<650){
 camera.position.z+=0.01;
}
else{
 camera.position.z+=0.02;
}

camera.lookAt((boy.position.x+girl.position.x)/2,0,0);

step++;
renderer.render(scene,camera);
}

animate();
</script>

</body>
</html>
